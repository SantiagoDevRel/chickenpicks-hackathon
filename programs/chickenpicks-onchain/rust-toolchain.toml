[toolchain]
# Rust 1.85+ supports edition 2024. Required because newer transitive deps
# in the Anchor 0.31 / Solana 2.x tree (crypto-common 0.2.1, etc.) ship as
# edition = "2024" crates. Pair with Solana CLI 2.x (the bundled rustc is
# also 1.85+, so SBF compilation accepts these crates too).
#
# DO NOT downgrade. Rust 1.79 cannot parse edition2024 manifests at all.
channel = "1.85.0"
components = ["rustfmt", "clippy"]
profile = "minimal"
