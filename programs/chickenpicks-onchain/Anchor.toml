[toolchain]
anchor_version = "0.31.0"
# Solana 2.x — bundled rustc supports edition 2024, required by anchor-spl
# 0.31's transitive crypto-common 0.2.1. If left at 1.18.26 the SBF compile
# fails on `feature edition2024 is required`.
# Use whatever stable version `release.anza.xyz/stable` resolves to at install.
# (omitted here so anchor test uses the locally-installed CLI version)

[features]
resolution = true
skip-lint = false

[programs.localnet]
chickenpicks_onchain = "Cdd53o33BTaZcmpZ55TemGPmZRR2mbMiYDEU6Mecb3ut"

[programs.devnet]
chickenpicks_onchain = "Cdd53o33BTaZcmpZ55TemGPmZRR2mbMiYDEU6Mecb3ut"

[programs.mainnet]
chickenpicks_onchain = "Cdd53o33BTaZcmpZ55TemGPmZRR2mbMiYDEU6Mecb3ut"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "../../keys/deployer.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test.validator]
url = "https://api.devnet.solana.com"

# NOTE: program ID placeholder above is a non-base58-valid string until
# `solana-keygen new -o keys/program.json` produces a real one. Then update:
#   1) all three [programs.*] entries to the new pubkey
#   2) declare_id!() in src/lib.rs
#   3) NEXT_PUBLIC_PROGRAM_ID in .env
#   4) packages/shared/src/constants.ts PROGRAM_ID export
